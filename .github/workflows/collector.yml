name: Collector

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Collect news
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python bot.py collect
      - name: Commit state files
        run: |
          git config --local user.email "bot@users.noreply.github.com"
          git config --local user.name "News Bot"
          git add queue.json processed_ids.json last_working_model.txt
          git diff --staged --quiet || git commit -m "Update bot state"
          git push
