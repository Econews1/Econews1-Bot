name: Poster

on:
  schedule:
    - cron: '*/6 * * * *'
  workflow_dispatch:

concurrency:
  group: news-bot-state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Post one news
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python bot.py post
      - name: Commit state files
        run: |
          git config --local user.email "bot@users.noreply.github.com"
          git config --local user.name "News Bot"
          for f in queue.json processed_ids.json last_working_model.txt posted_titles.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "Update bot state"
          git pull --rebase origin main
          git push origin main
